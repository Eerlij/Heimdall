# Heimdall local stack. See README "Run modes".
name: heimdall

services:
  postgres:
    image: postgres:18
    env_file: .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PG18 images keep data under /var/lib/postgresql/<major>/docker; mount the parent.
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  backend:
    profiles: [full]
    build:
      context: ../backend
      secrets: [extra-ca-cert]
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/heimdall
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # App port 8080 stays on the internal network (nginx fronts it in later plans); management is local-only.
      - "127.0.0.1:8081:8081"

secrets:
  # Extra CA trusted only while building images (TLS-intercepting antivirus/proxy). Empty by default.
  extra-ca-cert:
    file: ${EXTRA_CA_CERT_FILE:-./certs/none.pem}

volumes:
  pgdata:
