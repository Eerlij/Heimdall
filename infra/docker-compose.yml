# Heimdall local stack. See README "Run modes".
name: heimdall

services:
  postgres:
    image: postgres:18
    # Only the secrets this service needs (not Keycloak admin or client secrets).
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      HEIMDALL_DB_PASSWORD: ${HEIMDALL_DB_PASSWORD:?set HEIMDALL_DB_PASSWORD in infra/.env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PG18 images keep data under /var/lib/postgresql/<major>/docker; mount the parent.
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP check: the entrypoint's temporary init server only listens on the socket, so this waits for init to finish.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U heimdall -d heimdall"]
      interval: 5s
      retries: 10

  # Identity provider (login, registration, tokens), served under /auth behind nginx.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    # Same flags in every mode; edge TLS and hostname come from nginx and PUBLIC_ORIGIN.
    command: start
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in infra/.env}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in infra/.env}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in infra/.env}
    extra_hosts:
      # Linux/CI parity: reach the host-run backend for back-channel logout.
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl; probe the management port (9000, inherits the /auth path) with bash /dev/tcp (503 until fully started, so check the status line).
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf "GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          head -n1 <&3 | grep -q " 200 "'
      interval: 10s
      retries: 10
      start_period: 60s

  # One-shot: applies infra/keycloak/realm/*.yaml to Keycloak, then exits.
  keycloak-config:
    image: adorsys/keycloak-config-cli:6.5.1-26
    restart: "no"
    environment:
      KEYCLOAK_URL: http://keycloak:8080/auth
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in infra/.env}
      IMPORT_FILES_LOCATIONS: /config/*
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      # Variables referenced by the realm file.
      KC_REGISTRATION_ALLOWED: ${KC_REGISTRATION_ALLOWED:-false}
      HEIMDALL_KEYCLOAK_CLIENT_SECRET: ${HEIMDALL_KEYCLOAK_CLIENT_SECRET:?set HEIMDALL_KEYCLOAK_CLIENT_SECRET in infra/.env}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in infra/.env}
      BACKCHANNEL_LOGOUT_URL: ${BACKCHANNEL_LOGOUT_URL:?set BACKCHANNEL_LOGOUT_URL in infra/.env}
    volumes:
      - ./keycloak/realm:/config:ro
    depends_on:
      keycloak:
        condition: service_healthy

  # Dev mail catcher: Keycloak's verification and reset emails land here.
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "127.0.0.1:8025:8025"

  # Single browser origin: /auth to Keycloak, API and OAuth endpoints to the backend.
  nginx:
    image: nginx:1.31-alpine
    ports:
      - "127.0.0.1:80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:?set BACKEND_UPSTREAM in infra/.env}
      # Substitute only our variable so nginx's own $host etc. survive.
      NGINX_ENVSUBST_FILTER: ^BACKEND_UPSTREAM$$
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
    depends_on:
      keycloak:
        condition: service_healthy
      keycloak-config:
        condition: service_completed_successfully

  backend:
    profiles: [full]
    build:
      context: ../backend
      secrets: [extra-ca-cert]
    environment:
      # Only the secrets this service needs (not the superuser or Keycloak admin/DB passwords).
      HEIMDALL_DB_PASSWORD: ${HEIMDALL_DB_PASSWORD:?set HEIMDALL_DB_PASSWORD in infra/.env}
      DB_URL: jdbc:postgresql://postgres:5432/heimdall
      HEIMDALL_KEYCLOAK_CLIENT_SECRET: ${HEIMDALL_KEYCLOAK_CLIENT_SECRET:?set HEIMDALL_KEYCLOAK_CLIENT_SECRET in infra/.env}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in infra/.env}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/auth
      HEIMDALL_COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # App port 8080 stays on the internal network (nginx fronts it in later plans); management is local-only.
      - "127.0.0.1:8081:8081"

secrets:
  # Extra CA trusted only while building images (TLS-intercepting antivirus/proxy). Empty by default.
  extra-ca-cert:
    file: ${EXTRA_CA_CERT_FILE:-./certs/none.pem}

volumes:
  pgdata:
